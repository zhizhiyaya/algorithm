<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
		<title>SelectSort Live Demo</title>
		<link rel="stylesheet" href="../style/base.css" />
	</head>
	<body class="m-vertical-wrap">
		<h1>Selection Sort 选择排序</h1>
		<div class="algorithm-info">
			<h3>算法原理：</h3>
			<p>1. 在未排序序列中找到最小（大）元素，存放到排序序列的起始位置</p>
			<p>2. 再从剩余未排序元素中继续寻找最小（大）元素，然后放到已排序序列的末尾</p>
			<p>3. 重复第二步，直到所有元素均排序完毕</p>
			<h3>动画说明：</h3>
			<p>🔍 <span style="color: #ff6b6b;">红色</span>：当前正在搜索的元素</p>
			<p>🎯 <span style="color: #4ecdc4;">绿色</span>：当前找到的最小元素</p>
			<p>✅ <span style="color: #45b7d1;">蓝色</span>：已排序区域</p>
		</div>
		<script src="../scripts/base.js" ></script>
		<script src="../scripts/verticalDom.js" ></script>
		<script src="./live.js"></script>
		<style>
			.algorithm-info {
				margin: 20px auto;
				padding: 20px;
				background: #f8f9fa;
				border-radius: 8px;
				max-width: 600px;
				font-family: Arial, sans-serif;
			}
			.algorithm-info h3 {
				color: #2c3e50;
				margin-bottom: 10px;
			}
			.algorithm-info p {
				margin: 8px 0;
				line-height: 1.6;
			}
			.m-vertical-wrap .child.searching { 
				background: #ff6b6b !important; 
				transition: all .5s ease-in .1s;
			}
			.m-vertical-wrap .child.minimum { 
				background: #4ecdc4 !important; 
				transition: all .5s ease-in .1s;
			}
			.m-vertical-wrap .child.sorted { 
				background: #45b7d1 !important; 
				transition: all .5s ease-in .1s;
			}
			.m-vertical-wrap .child.light { 
				background: #ffa500 !important; 
				transition: all .5s ease-in .1s;
			}
		</style>
	</body>
</html>
